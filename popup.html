<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CP Sloth</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      width: 380px;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 18px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 11px;
      background: #064e3b;
      color: #6ee7b7;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      height: 90px;
      box-sizing: border-box;
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 8px;
      color: var(--text);
      padding: 8px;
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
      margin-bottom: 12px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      flex: 1;
      background: var(--accent);
      color: #052e16;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover {
      background: var(--accent-hover);
    }
    button.secondary {
      background: #334155;
      color: var(--text);
      flex: 0.8;
    }
    button.secondary:hover {
      background: #475569;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #output {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-size: 12.5px;
      line-height: 1.5;
      max-height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      display: none;
    }
    .footer {
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🦥 CP Sloth</h1>
    <span class="badge">Local Gemma 3</span>
  </div>

  <label for="code-input">Optional: Paste Your C++ / Code Solution</label>
  <textarea id="code-input" placeholder="// Too lazy to dry-run? Paste your code here (or leave blank to just generate edge cases from the open tab)..."></textarea>

  <div class="btn-row">
    <button id="analyze-btn">🦥 Do the Thinking</button>
    <button id="copy-btn" class="secondary" style="display:none;">Copy Output</button>
  </div>

  <div id="output"></div>

  <div class="footer">
    100% Offline Inference • Powered by Ollama & Gemma
  </div>

  <script src="popup.js"></script>
</body>
</html>
